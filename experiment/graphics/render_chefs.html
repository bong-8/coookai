<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="256" height="256"></canvas>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(256,256); renderer.setClearColor(0,0); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff,1.6));
const dl=new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(2,5,4); scene.add(dl);
const cam=new THREE.OrthographicCamera(-0.7,0.7,0.7,-0.7,0.1,50);
const loader=new GLTFLoader();
function hat(color,top){
  const g=new THREE.Group();
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.8});
  const band=new THREE.MeshStandardMaterial({color,roughness:.6});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.07,24),band); b.position.y=.035; g.add(b);
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.17,.19,.20,24),white); c.position.y=.17; g.add(c);
  const p=new THREE.Mesh(new THREE.SphereGeometry(.23,24,16),white); p.scale.set(1,.62,1); p.position.y=.30; g.add(p);
  g.scale.setScalar(0.8); g.position.y=top-0.03; return g;
}
window.renderOne=async function(name,dirDeg,hatColor){
  while(scene.children.length>2) scene.remove(scene.children[2]);
  const gltf=await loader.loadAsync('GLB_src/GLB format/'+name+'.glb');
  const m=gltf.scene; const root=new THREE.Group(); root.add(m); scene.add(root);
  const box=new THREE.Box3().setFromObject(m); const h=box.max.y-box.min.y;
  const s=0.66/h; m.scale.setScalar(s); m.position.y=-box.min.y*s; m.position.x=-(box.min.x+box.max.x)/2*s; m.position.z=-(box.min.z+box.max.z)/2*s;
  const top=h*s; root.add(hat(hatColor,top));
  root.rotation.y=dirDeg*Math.PI/180;
  cam.position.set(0,1.05,1.5); cam.lookAt(0,0.5,0);
  renderer.render(scene,cam);
  return document.getElementById('c').toDataURL('image/png');
}
window.ready=true;
</script></body></html>
